####################################################################
# e2e-tests/docker-compose.yml
#
# Postgres ONLY. Kafka is intentionally NOT declared here: a shared
# broker already runs from ~/warehouse-systems/docker-compose.kafka.yml
# (container "warehouse-kafka", host port 9092) and every service repo's
# own README says to connect to it rather than spin up a second one.
# scripts/02-up-infra.sh starts that compose file too if it isn't
# already running.
#
# Each service gets its OWN Postgres instance, on its own host port,
# using the SAME database name/user/password its own repo's
# docker-compose.yml already uses (so DATABASE_URL construction is a
# copy-paste of what each service expects). Ports are offset from the
# services' own defaults (normally all 5432) to avoid colliding with a
# developer's per-repo `docker compose up` left running from another
# session.
####################################################################
name: warehouse-e2e

services:
  postgres-facility:
    image: postgres:16
    container_name: e2e-postgres-facility
    restart: unless-stopped
    environment:
      POSTGRES_USER: facility
      POSTGRES_PASSWORD: facility
      POSTGRES_DB: facility
    ports:
      - "5441:5432"
    volumes:
      - e2e_facility_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facility -d facility"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-inventory:
    image: postgres:16
    container_name: e2e-postgres-inventory
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "5442:5432"
    volumes:
      - e2e_inventory_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-wes:
    image: postgres:16
    container_name: e2e-postgres-wes
    restart: unless-stopped
    environment:
      POSTGRES_USER: wes
      POSTGRES_PASSWORD: wes
      POSTGRES_DB: wes
    ports:
      - "5443:5432"
    volumes:
      - e2e_wes_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wes -d wes"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-fulfillment:
    image: postgres:16
    container_name: e2e-postgres-fulfillment
    restart: unless-stopped
    environment:
      POSTGRES_USER: fulfillment
      POSTGRES_PASSWORD: fulfillment
      POSTGRES_DB: fulfillment_execution
    ports:
      - "5444:5432"
    volumes:
      - e2e_fulfillment_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfillment -d fulfillment_execution"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-workforce:
    image: postgres:16
    container_name: e2e-postgres-workforce
    restart: unless-stopped
    environment:
      POSTGRES_USER: workforce
      POSTGRES_PASSWORD: workforce
      POSTGRES_DB: workforce
    ports:
      - "5445:5432"
    volumes:
      - e2e_workforce_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workforce -d workforce"]
      interval: 3s
      timeout: 3s
      retries: 20

  # order-management (6th bounded context — the choreographed-release
  # redesign, see this repo's env.sh header for the port-offset rationale).
  # Own user/db name "order", matching order-management's own
  # docker-compose.yml, on host port 5446 (past this harness's own
  # 5441-5445 range and disjoint from order-management's own :5434
  # default).
  postgres-order:
    image: postgres:16
    container_name: e2e-postgres-order
    restart: unless-stopped
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
      POSTGRES_DB: order
    ports:
      - "5446:5432"
    volumes:
      - e2e_order_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d order"]
      interval: 3s
      timeout: 3s
      retries: 20

  # process-path-management (8th bounded context — see env.sh's own
  # comment for the Generic Subdomain rationale). Own user/db name
  # "process_path", on host port 5447 (past this harness's own
  # 5441-5446 range).
  postgres-process-path:
    image: postgres:16
    container_name: e2e-postgres-process-path
    restart: unless-stopped
    environment:
      POSTGRES_USER: process_path
      POSTGRES_PASSWORD: process_path
      POSTGRES_DB: process_path
    ports:
      - "5447:5432"
    volumes:
      - e2e_process_path_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U process_path -d process_path"]
      interval: 3s
      timeout: 3s
      retries: 20

  # labor-performance (7th bounded context — see env.sh's own comment
  # for the pure-Kafka-consumer rationale). Own user/db name "labor",
  # on host port 5448 (past this harness's own 5441-5447 range),
  # matching labor-performance's own docker-compose.yml naming.
  postgres-labor:
    image: postgres:16
    container_name: e2e-postgres-labor
    restart: unless-stopped
    environment:
      POSTGRES_USER: labor
      POSTGRES_PASSWORD: labor
      POSTGRES_DB: labor
    ports:
      - "5448:5432"
    volumes:
      - e2e_labor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labor -d labor"]
      interval: 3s
      timeout: 3s
      retries: 20

  # network-fulfillment (9th bounded context — Supporting/ACL to the
  # external retail network, ADR 0001). Own user/db name "network", on
  # host port 5449 (past this harness's own 5441-5448 range).
  postgres-network:
    image: postgres:16
    container_name: e2e-postgres-network
    restart: unless-stopped
    environment:
      POSTGRES_USER: network
      POSTGRES_PASSWORD: network
      POSTGRES_DB: network
    ports:
      - "5449:5432"
    volumes:
      - e2e_network_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U network -d network"]
      interval: 3s
      timeout: 3s
      retries: 20

  # product-master (10th bounded context — owner of SKU classification and
  # the physical profile, see env.sh's own comment). Own user/db name
  # "product_master", on host port 5450 (past this harness's own
  # 5441-5449 range). Migrations are embedded in its binary.
  postgres-product-master:
    image: postgres:16
    container_name: e2e-postgres-product-master
    restart: unless-stopped
    environment:
      POSTGRES_USER: product_master
      POSTGRES_PASSWORD: product_master
      POSTGRES_DB: product_master
    ports:
      - "5450:5432"
    volumes:
      - e2e_product_master_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_master -d product_master"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  e2e_facility_pg_data:
  e2e_inventory_pg_data:
  e2e_wes_pg_data:
  e2e_fulfillment_pg_data:
  e2e_workforce_pg_data:
  e2e_order_pg_data:
  e2e_process_path_pg_data:
  e2e_labor_pg_data:
  e2e_network_pg_data:
  e2e_product_master_pg_data:
