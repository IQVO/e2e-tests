# Declared surfaces; clusterChecks are Phase 4+ obligations, not executed native coverage.
suites:
  native-smoke: ~@cluster && ~@resilience && ~@soak
  cluster-acceptance: '@cluster'
  resilience: '@resilience'
  soak: '@soak'
components:
  order-management:
    kinds:
    - backend
    - oltp
    - mcp
    - projector
    - reports
    - mfe
    commands:
      backend: order
      mcp: mcp
      projector: order-projector
      reports: order-reports
    remote: order_mgmt_mfe/App
    nativeScenarios:
    - order-release
    - promise-repromise
    - capability-promise
    - mcp-smoke
    clusterChecks:
    - api
    - mcp
    - reports
    - browser
