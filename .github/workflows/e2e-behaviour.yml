  # inbound-receiving's @inbound-receiving scenarios (ASN, receipt, the event-driven
  # handover to inventory-storage; inbound-receiving ADR 0003, inventory-storage ADR
  # 0037) and the appointment legs, which since inbound-receiving ADR 0019 are owned
  # by dock-scheduling (booking) and yard-management (gate check-in): inbound-receiving
  # sees the appointment through its local copy. facility-layout declares the dock
  # door inbound-receiving's door copy is fed from (DOCK_DOOR_CONSUMER_GROUP).
  # The mastercase scenarios carry the same tag and need exception-management (a
  # repeated SSCC raises a carton discrepancy it turns into a case) and
  # facility-layout (the seeded case and loose bins).
  inbound-receiving-scenario:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

