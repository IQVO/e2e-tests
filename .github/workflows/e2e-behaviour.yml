          set -euo pipefail
          dbs="postgres-process-path postgres-facility postgres-product-master postgres-inventory postgres-wes postgres-fulfillment postgres-workforce postgres-order postgres-planning postgres-nip"
          docker compose -f docker-compose.yml up -d ${dbs}
