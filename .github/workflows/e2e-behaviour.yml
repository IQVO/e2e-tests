name: E2E Behaviour

# Phase 5 Task 5.2 of the harness-coverage-expansion plan (G6): the
# godog black-box suite this repo owns is idempotent, ~40s, and until
# this workflow existed it was run ONLY by a human/agent locally before
# merge -- CI never fired it (see ci.yml's own long-standing comment
# explaining why: no multi-repo checkout, no Kafka). This workflow closes
# that gap for bootstrap.feature, the flagship end-to-end scenario, via
# a real multi-repo checkout + a real single-node Kafka broker + real
# per-service Postgres instances, staged deliberately as ONE scenario
# first rather than the full suite -- see this repo's CLAUDE.md/AGENTS.md
# for why growing this incrementally (not all 8 features at once) is the
# safer rollout.
#
# This is a SEPARATE workflow file from ci.yml (not a new job in it)
# because it needs a materially different topology (7 sibling-repo
# checkouts, a live Kafka broker, 7 live Postgres instances, 7 built
# binaries) that every other job in ci.yml deliberately does not carry.
#
# product-master (classification owner, its ADR 0003) is the 7th service:
# inventory-storage's classification PUT answers 410, and inventory-storage,
# order-management, wes-work-planning and fulfillment-execution read local
# copies of warehouse.product-master.events (PRODUCT_CLASSIFICATION_MODE=
# kafka; "http" fails at boot). The run covers @bootstrap plus the
# @product-master scenario, which needs nothing beyond these 7 services.
on:
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 7am UTC (1h after ci.yml's mutation job)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  bootstrap-scenario:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 20

    services:
      # Single-node KRaft Kafka, the exact config already proven to work
      # in this fleet (order-management/docker-compose.kafka.yml) -- a
      # GitHub Actions `services:` container rather than testcontainers,
      # since every consumer/producer here is a real long-running Go
      # binary spawned by shell, not a Go test process that could manage
      # its own testcontainers lifecycle.
      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"

    steps:
      - name: Checkout e2e-tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: e2e-tests

      - name: Checkout facility-layout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/facility-layout
          ref: develop
          path: facility-layout

      - name: Checkout inventory-storage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/inventory-storage
          ref: develop
          path: inventory-storage

      - name: Checkout wes-work-planning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/wes-work-planning
          ref: develop
          path: wes-work-planning

      - name: Checkout fulfillment-execution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/fulfillment-execution
          ref: develop
          path: fulfillment-execution

      - name: Checkout workforce-management
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/workforce-management
          ref: develop
          path: workforce-management

      - name: Checkout order-management
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/order-management
          ref: develop
          path: order-management

      - name: Checkout product-master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/product-master
          ref: develop
          path: product-master

      - name: Checkout warehouse-infra (config only -- process-path catalogue)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/warehouse-infra
          ref: develop
          path: warehouse-infra
          sparse-checkout: |
            config/process-paths
          sparse-checkout-cone-mode: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: e2e-tests/go.mod

      - name: Wait for Kafka to accept connections
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/9092) >/dev/null 2>&1; then
              echo "kafka is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::kafka never became reachable on localhost:9092"
          exit 1

      - name: Pre-create every topic the 7 core services publish to
        run: |
          set -euo pipefail
          # KAFKA_AUTO_CREATE_TOPICS_ENABLE=true is not reliable enough on
          # a single-node KRaft broker that just booted: the FIRST publish
          # from a freshly-started service can race the broker's own
          # metadata propagation and fail with "Unknown Topic Or
          # Partition" (confirmed for real on run 34921874416 -- this
          # workflow's first genuinely-past-startup run). Creating every
          # topic explicitly up front, then confirming each one has an
          # assigned partition leader, removes that race entirely. Topic
          # list is the real, complete set every one of the 7 checked-out
          # services' own source publishes to (grepped from each repo's
          # internal/ for the literal "warehouse.*" topic-name strings),
          # not a guess.
          kafka_container="$(docker ps --filter ancestor=apache/kafka:3.8.0 --format '{{.ID}}' | head -1)"
          if [[ -z "${kafka_container}" ]]; then
            echo "::error::could not find the running apache/kafka container"
            exit 1
          fi
          topics=(
            warehouse.facility.events
            warehouse.facility.analytics
            warehouse.product-master.events
            warehouse.inventory.events
            warehouse.inventory.analytics
            warehouse.work-planning.events
            warehouse.wes.analytics
            warehouse.fulfillment.events
            warehouse.fulfillment.analytics
            warehouse.workforce.events
            warehouse.workforce.analytics
            warehouse.order-management.events
            warehouse.order-management.analytics
            # Consumed (not published) by wes-work-planning's integration
            # consumer group (NIP WorkDemandReleased, wes-work-planning #150).
            # No service here publishes it, but a kafka-go group subscribed
            # to a topic that does not exist never gets an assignment, so
            # ShiftPlanCommitted etc. would stall with it.
            warehouse.network-inventory-planning.events
          )
          for t in "${topics[@]}"; do
            docker exec "${kafka_container}" /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 --create --if-not-exists \
              --topic "${t}" --partitions 1 --replication-factor 1
          done
          echo "waiting for every topic to have an assigned partition leader"
          for t in "${topics[@]}"; do
            deadline=$((SECONDS + 30))
            while true; do
              leader="$(docker exec "${kafka_container}" /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server localhost:9092 --describe --topic "${t}" 2>/dev/null \
                | grep -oE 'Leader: [0-9]+' | head -1 || true)"
              [[ -n "${leader}" ]] && break
              if (( SECONDS > deadline )); then
                echo "::error::${t} never got an assigned partition leader"
                exit 1
              fi
              sleep 1
            done
          done
          echo "all topics ready"

      - name: Start per-service Postgres instances
        working-directory: e2e-tests
        run: |
          docker compose -f docker-compose.yml up -d \
            postgres-facility postgres-inventory postgres-wes \
            postgres-fulfillment postgres-workforce postgres-order \
            postgres-product-master
          for svc in postgres-facility postgres-inventory postgres-wes postgres-fulfillment postgres-workforce postgres-order postgres-product-master; do
            deadline=$((SECONDS + 60))
            while true; do
              status="$(docker inspect -f '{{.State.Health.Status}}' "e2e-${svc}" 2>/dev/null || echo starting)"
              [[ "${status}" == "healthy" ]] && break
              if (( SECONDS > deadline )); then
                echo "::error::${svc} never became healthy"
                docker logs "e2e-${svc}" || true
                exit 1
              fi
              sleep 1
            done
            echo "${svc} healthy"
          done

      - name: Build the 7 core service binaries
        working-directory: e2e-tests
        run: |
          set -euo pipefail
          source env.sh
          mkdir -p "${BIN_DIR}"

          build_one() {
            local name="$1" repo="$2" cmd_pkg="$3"
            echo "==> go build ${name} (${repo}/cmd/${cmd_pkg})"
            # setup-go pins GOTOOLCHAIN=local to e2e-tests' own go.mod, but a
            # sibling may require a newer Go (product-master needs >= 1.27.1).
            # auto lets each repo's go.mod pick its toolchain, as it does on
            # a developer machine (GOTOOLCHAIN's default).
            ( cd "${repo}" && GOTOOLCHAIN=auto CGO_ENABLED=0 go build -o "${BIN_DIR}/${name}" "./cmd/${cmd_pkg}" )
            echo "  OK   ${name} -> ${BIN_DIR}/${name}"
          }

          # Deliberately only the 7 services the CI scenarios need (see
          # allServicesAreHealthy in e2e_test.go) -- NOT scripts/01-build.sh
          # verbatim, since that script unconditionally also builds
          # process-path-management/labor-performance/warehouse-ops-agent
          # and every MCP server, none of which this job checks out.
          build_one facility   "${FACILITY_REPO}"    facility
          build_one inventory  "${INVENTORY_REPO}"   inventory
          build_one wes        "${WES_REPO}"         wes
          build_one execution  "${FULFILLMENT_REPO}" execution
          build_one workforce  "${WORKFORCE_REPO}"   workforce
          build_one order      "${ORDER_REPO}"       order
          build_one product-master "${PRODUCT_MASTER_REPO}" api
        continue-on-error: false

      - name: Start the 7 core services and run bootstrap.feature + product_master.feature
        working-directory: e2e-tests
        run: |
          set -euo pipefail
          source env.sh

          start_one() {
            local name="$1"; shift
            log "starting ${name}"
            ( "$@" > "/tmp/${name}.log" 2>&1 & echo $! > "/tmp/${name}.pid" )
          }

          wait_http() {
            local url="$1" deadline=$((SECONDS + 30))
            while true; do
              curl -sf "${url}" >/dev/null 2>&1 && return 0
              if (( SECONDS > deadline )); then
                echo "::error::${url} never became healthy"
                return 1
              fi
              sleep 1
            done
          }

          env HTTP_ADDR=":${FACILITY_HTTP_PORT}" DATABASE_URL="${FACILITY_DB_URL}" PGPASSWORD="facility" MIGRATIONS_PATH="${FACILITY_REPO}/migrations" EVENT_PUBLISHER=kafka KAFKA_BROKERS="${KAFKA_BROKERS}" LOG_LEVEL=info \
            "${BIN_DIR}/facility" > /tmp/facility.log 2>&1 &
          wait_http "${FACILITY_BASE_URL}/healthz"

          env HTTP_ADDR=":${PRODUCT_MASTER_HTTP_PORT}" DATABASE_URL="${PRODUCT_MASTER_DB_URL}" PGPASSWORD="product_master" EVENT_PUBLISHER=kafka KAFKA_BROKERS="${KAFKA_BROKERS}" SHUTDOWN_DRAIN_DELAY=0 LOG_LEVEL=info \
            "${BIN_DIR}/product-master" > /tmp/product-master.log 2>&1 &
          wait_http "${PRODUCT_MASTER_BASE_URL}/healthz"

          env HTTP_ADDR=":${INVENTORY_HTTP_PORT}" DATABASE_URL="${INVENTORY_DB_URL}" PGPASSWORD="inventory" MIGRATIONS_PATH="${INVENTORY_REPO}/migrations" EVENT_PUBLISHER=kafka KAFKA_BROKERS="${KAFKA_BROKERS}" LOCATION_LOOKUP_MODE=kafka FACILITY_LAYOUT_BASE_URL="${FACILITY_BASE_URL}" PRODUCT_MASTER_CONSUMER_GROUP="${INVENTORY_PRODUCT_MASTER_CONSUMER_GROUP}" LOG_LEVEL=info \
            "${BIN_DIR}/inventory" > /tmp/inventory.log 2>&1 &
          wait_http "${INVENTORY_BASE_URL}/healthz"

          env HTTP_ADDR=":${WES_HTTP_PORT}" DATABASE_URL="${WES_DB_URL}" PGPASSWORD="wes" MIGRATIONS_PATH="${WES_REPO}/migrations" EVENT_PUBLISHER=kafka KAFKA_BROKERS="${KAFKA_BROKERS}" KAFKA_CONSUMER_GROUP="${WES_CONSUMER_GROUP}" PRODUCT_CLASSIFICATION_MODE=kafka PRODUCT_CLASSIFICATION_CONSUMER_GROUP="${WES_CLASSIFICATION_CONSUMER_GROUP}" PATH_CATALOGUE_FILE="${PATH_CATALOGUE_FILE}" LOG_LEVEL=info \
            "${BIN_DIR}/wes" > /tmp/wes.log 2>&1 &
          wait_http "${WES_BASE_URL}/healthz"

          ( cd "${FULFILLMENT_REPO}" && env HTTP_ADDR=":${FULFILLMENT_HTTP_PORT}" DATABASE_URL="${FULFILLMENT_DB_URL}" PGPASSWORD="fulfillment" EVENT_PUBLISHER=kafka KAFKA_BROKERS="${KAFKA_BROKERS}" WORK_RELEASED_CONSUMER_GROUP="${FULFILLMENT_CONSUMER_GROUP}" PRODUCT_CLASSIFICATION_MODE=kafka PRODUCT_CLASSIFICATION_CONSUMER_GROUP="${FULFILLMENT_CLASSIFICATION_CONSUMER_GROUP}" PATH_CATALOGUE_FILE="${PATH_CATALOGUE_FILE}" LOG_LEVEL=info \
            "${BIN_DIR}/execution" > /tmp/execution.log 2>&1 & )
          wait_http "${FULFILLMENT_BASE_URL}/healthz"

          env HTTP_ADDR=":${WORKFORCE_HTTP_PORT}" DATABASE_URL="${WORKFORCE_DB_URL}" PGPASSWORD="workforce" MIGRATIONS_PATH="${WORKFORCE_REPO}/migrations" EVENT_PUBLISHER=kafka KAFKA_BROKERS="${KAFKA_BROKERS}" PATH_CATALOGUE_FILE="${PATH_CATALOGUE_FILE}" INSTALLED_CAPACITY_MODE=http FULFILLMENT_EXECUTION_BASE_URL="${FULFILLMENT_BASE_URL}" LOG_LEVEL=info \
            "${BIN_DIR}/workforce" > /tmp/workforce.log 2>&1 &
          wait_http "${WORKFORCE_BASE_URL}/healthz"

          env HTTP_ADDR=":${ORDER_HTTP_PORT}" DATABASE_URL="${ORDER_DB_URL}" PGPASSWORD="order" MIGRATIONS_PATH="${ORDER_REPO}/migrations" EVENT_PUBLISHER=kafka KAFKA_BROKERS="${KAFKA_BROKERS}" INVENTORY_STORAGE_BASE_URL="${INVENTORY_BASE_URL}" PRODUCT_CLASSIFICATION_MODE=kafka PRODUCT_CLASSIFICATION_CONSUMER_GROUP="${ORDER_CLASSIFICATION_CONSUMER_GROUP}" LOG_LEVEL=info \
            "${BIN_DIR}/order" > /tmp/order.log 2>&1 &
          wait_http "${ORDER_BASE_URL}/healthz"

          echo "all 7 core services healthy"

          export FACILITY_BASE_URL INVENTORY_BASE_URL WES_BASE_URL FULFILLMENT_BASE_URL WORKFORCE_BASE_URL ORDER_BASE_URL PRODUCT_MASTER_BASE_URL
          # godog tag expression: a comma is OR.
          export GODOG_TAGS="@bootstrap,@product-master"
          go test -v -run TestMain -timeout 5m .

      - name: Dump service logs on failure
        if: failure()
        run: tail -n +1 /tmp/facility.log /tmp/product-master.log /tmp/inventory.log /tmp/wes.log /tmp/execution.log /tmp/workforce.log /tmp/order.log 2>&1 || true
      # This job checks the repo out into ./e2e-tests next to the service repos, so repo scripts (and the git remote
      # `gh` needs) are only found from that directory. A scheduled run is what the weekly sensor reads; a manual run
      # on develop counts as proof too (harness-health), so both trigger these steps. They must run for real on a
      # dispatch, otherwise a broken step stays invisible until the next Monday.
      - name: Open or refresh the harness:red issue on a failure of the weekly (or a manual develop) run
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
        working-directory: e2e-tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harness/red_issue.py bootstrap-scenario "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Close the harness:red issue when the weekly (or a manual develop) run recovers
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
        working-directory: e2e-tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harness/red_issue.py bootstrap-scenario --close


  # The inter-warehouse transfer saga (features/inter_warehouse_transfer.feature)
  # across the 6 core services PLUS product-master (classification owner, the
  # readers refuse to boot without it), network-inventory-planning and
  # warehouse-planning, over the same single-node Kafka. Separate job (not
  # extra steps in the bootstrap one) so a transfer-saga failure never masks
  # the flagship @bootstrap signal. It has no harness:red issue steps of its
  # own: red_issue.py is keyed to the bootstrap job. NOTE: this job is the
  # only place the scenario runs in CI; locally run it per README.md.
  inter-warehouse-transfer-scenario:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25

    services:
      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"

    steps:
      - name: Checkout e2e-tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: e2e-tests

      - name: Checkout facility-layout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/facility-layout
          ref: develop
          path: facility-layout

      - name: Checkout inventory-storage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/inventory-storage
          ref: develop
          path: inventory-storage

      - name: Checkout wes-work-planning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/wes-work-planning
          ref: develop
          path: wes-work-planning

      - name: Checkout fulfillment-execution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/fulfillment-execution
          ref: develop
          path: fulfillment-execution

      - name: Checkout workforce-management
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/workforce-management
          ref: develop
          path: workforce-management

      - name: Checkout order-management
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/order-management
          ref: develop
          path: order-management

      - name: Checkout product-master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/product-master
          ref: develop
          path: product-master

      - name: Checkout network-inventory-planning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/network-inventory-planning
          ref: develop
          path: network-inventory-planning

      - name: Checkout warehouse-planning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/warehouse-planning
          ref: develop
          path: warehouse-planning

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: e2e-tests/go.mod

      - name: Wait for Kafka to accept connections
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/9092) >/dev/null 2>&1; then
              echo "kafka is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::kafka never became reachable on localhost:9092"
          exit 1

      - name: Pre-create every topic the saga's services publish to
        run: |
          set -euo pipefail
          # Same race the bootstrap job documents (a first publish can beat
          # the broker's metadata propagation); the transfer saga adds the
          # NIP and warehouse-planning topics.
          kafka_container="$(docker ps --filter ancestor=apache/kafka:3.8.0 --format '{{.ID}}' | head -1)"
          if [[ -z "${kafka_container}" ]]; then
            echo "::error::could not find the running apache/kafka container"
            exit 1
          fi
          topics=(
            warehouse.facility.events
            warehouse.facility.analytics
            warehouse.product-master.events
            warehouse.inventory.events
            warehouse.inventory.analytics
            warehouse.work-planning.events
            warehouse.wes.analytics
            warehouse.fulfillment.events
            warehouse.fulfillment.analytics
            warehouse.workforce.events
            warehouse.workforce.analytics
            warehouse.order-management.events
            warehouse.order-management.analytics
            warehouse.network-inventory-planning.events
            warehouse.warehouse-planning.events
            warehouse.warehouse-planning.analytics
          )
          for t in "${topics[@]}"; do
            docker exec "${kafka_container}" /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 --create --if-not-exists \
              --topic "${t}" --partitions 1 --replication-factor 1
          done
          for t in "${topics[@]}"; do
            deadline=$((SECONDS + 30))
            while true; do
              leader="$(docker exec "${kafka_container}" /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server localhost:9092 --describe --topic "${t}" 2>/dev/null \
                | grep -oE 'Leader: [0-9]+' | head -1 || true)"
              [[ -n "${leader}" ]] && break
              if (( SECONDS > deadline )); then
                echo "::error::${t} never got an assigned partition leader"
                exit 1
              fi
              sleep 1
            done
          done
          echo "all topics ready"

      - name: Start per-service Postgres instances
        working-directory: e2e-tests
        run: |
          set -euo pipefail
          dbs="postgres-facility postgres-inventory postgres-wes postgres-fulfillment postgres-workforce postgres-order postgres-product-master postgres-nip postgres-planning"
          docker compose -f docker-compose.yml up -d ${dbs}
          for svc in ${dbs}; do
            deadline=$((SECONDS + 60))
            while true; do
              status="$(docker inspect -f '{{.State.Health.Status}}' "e2e-${svc}" 2>/dev/null || echo starting)"
              [[ "${status}" == "healthy" ]] && break
              if (( SECONDS > deadline )); then
                echo "::error::${svc} never became healthy"
                docker logs "e2e-${svc}" || true
                exit 1
              fi
              sleep 1
            done
            echo "${svc} healthy"
          done

      - name: Build the 9 binaries the transfer saga needs
        working-directory: e2e-tests
        run: |
          set -euo pipefail
          source env.sh
          mkdir -p "${BIN_DIR}"

          build_one() {
            local name="$1" repo="$2" cmd_pkg="$3"
            echo "==> go build ${name} (${repo}/cmd/${cmd_pkg})"
            # GOTOOLCHAIN=auto: setup-go pins the toolchain to e2e-tests' own
            # go.mod, but a sibling may require a newer Go (product-master
            # needs >= 1.27.1).
            ( cd "${repo}" && GOTOOLCHAIN=auto CGO_ENABLED=0 go build -o "${BIN_DIR}/${name}" "./cmd/${cmd_pkg}" )
            echo "  OK   ${name} -> ${BIN_DIR}/${name}"
          }

          # Not scripts/01-build.sh verbatim: it also builds the services
          # and MCP servers this job does not check out.
          build_one facility   "${FACILITY_REPO}"           facility
          build_one inventory  "${INVENTORY_REPO}"          inventory
          build_one wes        "${WES_REPO}"                wes
          build_one execution  "${FULFILLMENT_REPO}"        execution
          build_one workforce  "${WORKFORCE_REPO}"          workforce
          build_one order      "${ORDER_REPO}"              order
          build_one product-master "${PRODUCT_MASTER_REPO}" api
          build_one nip        "${NIP_REPO}"                network-inventory-planning
          build_one planning   "${WAREHOUSE_PLANNING_REPO}" api

      - name: Start the 9 services and run inter_warehouse_transfer.feature
        working-directory: e2e-tests
        run: |
          set -euo pipefail
          source env.sh

          wait_http() {
            local url="$1" deadline=$((SECONDS + 60))
            while true; do
              curl -sf "${url}" >/dev/null 2>&1 && return 0
              if (( SECONDS > deadline )); then
                echo "::error::${url} never became healthy"
                return 1
              fi
              sleep 1
            done
          }

          # Same env as scripts/03-up-services.sh (the single source of
          # truth for what each service needs); per-service consumer
          # groups come from env.sh's run-scoped suffix.
          env HTTP_ADDR=":${FACILITY_HTTP_PORT}" DATABASE_URL="${FACILITY_DB_URL}" PGPASSWORD="facility" MIGRATIONS_PATH="${FACILITY_REPO}/migrations" EVENT_PUBLISHER=kafka KAFKA_BROKERS="${KAFKA_BROKERS}" LOG_LEVEL=info \
            "${BIN_DIR}/facility" > /tmp/facility.log 2>&1 &
          wait_http "${FACILITY_BASE_URL}/healthz"

          # product-master owns SKU classification; the readers below keep a
          # local copy of its events and refuse to boot in any other mode.
          env HTTP_ADDR=":${PRODUCT_MASTER_HTTP_PORT}" DATABASE_URL="${PRODUCT_MASTER_DB_URL}" PGPASSWORD="product_master" EVENT_PUBLISHER=kafka KAFKA_BROKERS="${KAFKA_BROKERS}" SHUTDOWN_DRAIN_DELAY=0 LOG_LEVEL=info \
            "${BIN_DIR}/product-master" > /tmp/product-master.log 2>&1 &
          wait_http "${PRODUCT_MASTER_BASE_URL}/healthz"

          env HTTP_ADDR=":${INVENTORY_HTTP_PORT}" DATABASE_URL="${INVENTORY_DB_URL}" PGPASSWORD="inventory" MIGRATIONS_PATH="${INVENTORY_REPO}/migrations" EVENT_PUBLISHER=kafka KAFKA_BROKERS="${KAFKA_BROKERS}" LOCATION_LOOKUP_MODE=kafka FACILITY_LAYOUT_BASE_URL="${FACILITY_BASE_URL}" TRANSFER_ALLOCATION_CONSUMER_MODE=kafka TRANSFER_ALLOCATION_CONSUMER_GROUP="${INVENTORY_TRANSFER_CONSUMER_GROUP}" PRODUCT_MASTER_CONSUMER_GROUP="${INVENTORY_PRODUCT_MASTER_CONSUMER_GROUP}" LOG_LEVEL=info \
            "${BIN_DIR}/inventory" > /tmp/inventory.log 2>&1 &
          wait_http "${INVENTORY_BASE_URL}/healthz"

          env HTTP_ADDR=":${WES_HTTP_PORT}" DATABASE_URL="${WES_DB_URL}" PGPASSWORD="wes" MIGRATIONS_PATH="${WES_REPO}/migrations" EVENT_PUBLISHER=kafka KAFKA_BROKERS="${KAFKA_BROKERS}" KAFKA_CONSUMER_GROUP="${WES_CONSUMER_GROUP}" PRODUCT_CLASSIFICATION_MODE=kafka PRODUCT_CLASSIFICATION_CONSUMER_GROUP="${WES_CLASSIFICATION_CONSUMER_GROUP}" PATH_CATALOGUE_FILE="${PATH_CATALOGUE_FILE}" LOG_LEVEL=info \
            "${BIN_DIR}/wes" > /tmp/wes.log 2>&1 &
          wait_http "${WES_BASE_URL}/healthz"

          ( cd "${FULFILLMENT_REPO}" && env HTTP_ADDR=":${FULFILLMENT_HTTP_PORT}" DATABASE_URL="${FULFILLMENT_DB_URL}" PGPASSWORD="fulfillment" EVENT_PUBLISHER=kafka KAFKA_BROKERS="${KAFKA_BROKERS}" WORK_RELEASED_CONSUMER_GROUP="${FULFILLMENT_CONSUMER_GROUP}" PRODUCT_CLASSIFICATION_MODE=kafka PRODUCT_CLASSIFICATION_CONSUMER_GROUP="${FULFILLMENT_CLASSIFICATION_CONSUMER_GROUP}" PATH_CATALOGUE_FILE="${PATH_CATALOGUE_FILE}" LOG_LEVEL=info \
            "${BIN_DIR}/execution" > /tmp/execution.log 2>&1 & )
          wait_http "${FULFILLMENT_BASE_URL}/healthz"

          env HTTP_ADDR=":${WORKFORCE_HTTP_PORT}" DATABASE_URL="${WORKFORCE_DB_URL}" PGPASSWORD="workforce" MIGRATIONS_PATH="${WORKFORCE_REPO}/migrations" EVENT_PUBLISHER=kafka KAFKA_BROKERS="${KAFKA_BROKERS}" PATH_CATALOGUE_FILE="${PATH_CATALOGUE_FILE}" INSTALLED_CAPACITY_MODE=http FULFILLMENT_EXECUTION_BASE_URL="${FULFILLMENT_BASE_URL}" LOG_LEVEL=info \
            "${BIN_DIR}/workforce" > /tmp/workforce.log 2>&1 &
          wait_http "${WORKFORCE_BASE_URL}/healthz"

          env HTTP_ADDR=":${ORDER_HTTP_PORT}" DATABASE_URL="${ORDER_DB_URL}" PGPASSWORD="order" MIGRATIONS_PATH="${ORDER_REPO}/migrations" EVENT_PUBLISHER=kafka KAFKA_BROKERS="${KAFKA_BROKERS}" INVENTORY_STORAGE_BASE_URL="${INVENTORY_BASE_URL}" PRODUCT_CLASSIFICATION_MODE=kafka PRODUCT_CLASSIFICATION_CONSUMER_GROUP="${ORDER_CLASSIFICATION_CONSUMER_GROUP}" LOG_LEVEL=info \
            "${BIN_DIR}/order" > /tmp/order.log 2>&1 &
          wait_http "${ORDER_BASE_URL}/healthz"

          env HTTP_ADDR=":${WAREHOUSE_PLANNING_HTTP_PORT}" DATABASE_URL="${WAREHOUSE_PLANNING_DB_URL}" PGPASSWORD="planning" MIGRATIONS_PATH="${WAREHOUSE_PLANNING_REPO}/internal/adapters/outbound/postgres/migrations" EVENT_PUBLISHER=kafka KAFKA_BROKERS="${KAFKA_BROKERS}" LABOR_CAPACITY_CONSUMER_GROUP="${WAREHOUSE_PLANNING_LABOR_CONSUMER_GROUP}" STORAGE_CAPACITY_CONSUMER_GROUP="${WAREHOUSE_PLANNING_STORAGE_CONSUMER_GROUP}" OUTBOX_RELAY_INTERVAL=500ms LOG_LEVEL=info \
            "${BIN_DIR}/planning" > /tmp/planning.log 2>&1 &
          wait_http "${WAREHOUSE_PLANNING_BASE_URL}/healthz"

          env HTTP_ADDR=":${NIP_HTTP_PORT}" DATABASE_URL="${NIP_DB_URL}" PGPASSWORD="nip" MIGRATIONS_PATH="${NIP_REPO}/internal/adapters/outbound/postgres/migrations" KAFKA_BROKERS="${KAFKA_BROKERS}" SITE_CAPABILITY_CONSUMER_GROUP="${NIP_CAPABILITY_CONSUMER_GROUP}" SITE_SKU_DEMAND_CONSUMER_GROUP="${NIP_DEMAND_CONSUMER_GROUP}" CAPACITY_PLAN_CONSUMER_GROUP="${NIP_CAPACITY_PLAN_CONSUMER_GROUP}" TRANSFER_REPLY_CONSUMER_GROUP="${NIP_TRANSFER_REPLY_CONSUMER_GROUP}" TRANSFER_FACT_CONSUMER_GROUP="${NIP_TRANSFER_FACT_CONSUMER_GROUP}" OUTBOX_RELAY_ENABLED=true TRANSFER_PICK_PATH_ID="${NIP_TRANSFER_PICK_PATH_ID}" TRANSFER_DISPATCH_PATH_ID="${NIP_TRANSFER_DISPATCH_PATH_ID}" PLANNING_MAX_STALENESS="${NIP_PLANNING_MAX_STALENESS}" LOG_LEVEL=info \
            "${BIN_DIR}/nip" > /tmp/nip.log 2>&1 &
          wait_http "${NIP_BASE_URL}/healthz"

          echo "all 9 services healthy"

          export FACILITY_BASE_URL INVENTORY_BASE_URL WES_BASE_URL FULFILLMENT_BASE_URL WORKFORCE_BASE_URL ORDER_BASE_URL
          export NIP_BASE_URL WAREHOUSE_PLANNING_BASE_URL NIP_DB_URL KAFKA_BROKERS NIP_TRANSFER_PICK_PATH_ID NIP_TRANSFER_DISPATCH_PATH_ID
          export GODOG_TAGS="@inter-warehouse-transfer"
          go test -v -run TestMain -timeout 10m .

      - name: Dump service logs on failure
        if: failure()
        run: tail -n +1 /tmp/facility.log /tmp/inventory.log /tmp/wes.log /tmp/execution.log /tmp/workforce.log /tmp/order.log /tmp/product-master.log /tmp/planning.log /tmp/nip.log 2>&1 || true
