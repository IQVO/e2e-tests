    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25

    services:
      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"

    steps:
      - name: Checkout e2e-tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: e2e-tests

      - name: Checkout facility-layout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/facility-layout
          ref: develop
          path: facility-layout

      - name: Checkout product-master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/product-master
          ref: develop
          path: product-master

      - name: Checkout inbound-receiving
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/inbound-receiving
          ref: develop
          path: inbound-receiving

      - name: Checkout dock-scheduling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/dock-scheduling
          ref: develop
          path: dock-scheduling

      - name: Checkout yard-management
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/yard-management
          ref: develop
          path: yard-management

      - name: Checkout outbound-shipping
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/outbound-shipping
          ref: develop
          path: outbound-shipping

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: e2e-tests/go.mod

      - name: Wait for Kafka to accept connections
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/9092) >/dev/null 2>&1; then
              echo "kafka is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::kafka never became reachable on localhost:9092"
          exit 1

      - name: Create every harness topic and wait for a leader on each
        working-directory: e2e-tests
        run: |
          # cmd/ensure-topics holds the one topic list of the whole estate, one
          # partition each: a consumer group on a topic that does not exist yet
          # is never assigned a partition, and the feature scans
          # warehouse.yard-management.events and warehouse.outbound-shipping.events
          # from their first offset, relying on one partition's publication order.
          GOTOOLCHAIN=auto go run ./cmd/ensure-topics

      - name: Start per-service Postgres instances
        working-directory: e2e-tests
        run: |
          set -euo pipefail
          dbs="postgres-facility postgres-product-master postgres-inbound-receiving postgres-dock-scheduling postgres-yard-management postgres-outbound-shipping"
          docker compose -f docker-compose.yml up -d ${dbs}
          for svc in ${dbs}; do
            deadline=$((SECONDS + 60))
            while true; do
              status="$(docker inspect -f '{{.State.Health.Status}}' "e2e-${svc}" 2>/dev/null || echo starting)"
              [[ "${status}" == "healthy" ]] && break
              if (( SECONDS > deadline )); then
                echo "::error::${svc} never became healthy"
                docker logs "e2e-${svc}" || true
                exit 1
              fi
              sleep 1
            done
            echo "${svc} healthy"
          done

      - name: Build the 7 binaries the yard journey needs
        working-directory: e2e-tests
        run: |
          set -euo pipefail
          source env.sh
          mkdir -p "${BIN_DIR}"

          build_one() {
            local name="$1" repo="$2" cmd_pkg="$3"
            echo "==> go build ${name} (${repo}/cmd/${cmd_pkg})"
            # GOTOOLCHAIN=auto: setup-go pins the toolchain to e2e-tests' own
            # go.mod, but a sibling may require a newer Go.
            ( cd "${repo}" && GOTOOLCHAIN=auto CGO_ENABLED=0 go build -o "${BIN_DIR}/${name}" "./cmd/${cmd_pkg}" )
            echo "  OK   ${name} -> ${BIN_DIR}/${name}"
          }

          # Not scripts/01-build.sh verbatim: it also builds the services and
          # MCP servers this job does not check out.
          build_one facility          "${FACILITY_REPO}"          facility
          build_one product-master    "${PRODUCT_MASTER_REPO}"    api
          build_one inbound-receiving "${INBOUND_REPO}"           api
          build_one dock-scheduling   "${DOCK_SCHEDULING_REPO}"   api
          build_one yard-management   "${YARD_REPO}"              api
          build_one yard-relay        "${YARD_REPO}"              relay
          build_one outbound-shipping "${OUTBOUND_SHIPPING_REPO}" api

      - name: Start the 6 services and the yard relay, run yard_journey.feature
        working-directory: e2e-tests
        run: |
          set -euo pipefail
          source scripts/lib.sh
          source scripts/services.sh

          # The env of every service lives in scripts/services.sh; the order
          # is the dependency order of scripts/03-up-services.sh. The legacy
          # importer group of dock-scheduling stays unset on purpose.
          up_facility
          up_product_master
          up_dock_scheduling
          up_yard_management
          up_yard_management_relay
          up_inbound_receiving
          up_outbound_shipping

          echo "all 6 services and the yard relay healthy"

          export FACILITY_BASE_URL PRODUCT_MASTER_BASE_URL INBOUND_BASE_URL DOCK_SCHEDULING_BASE_URL YARD_BASE_URL OUTBOUND_SHIPPING_BASE_URL KAFKA_BROKERS
          export GODOG_TAGS="@yard-journey"
          go test -v -run TestMain -timeout 8m .

      - name: Dump service logs on failure
        if: failure()
        working-directory: e2e-tests
        run: tail -n 400 logs/*.log 2>&1 || true

