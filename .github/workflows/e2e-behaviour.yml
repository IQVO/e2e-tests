name: E2E Behaviour

# The godog black-box suite this repo owns, run against a real multi-repo
# checkout, a real single-node Kafka broker and real per-service Postgres
# instances. One job per scenario group, each in its own job so one failing
# never masks the flagship @bootstrap signal:
#
#   bootstrap-scenario              @bootstrap + @product-master (8 services:
#                                   process-path-management, facility-layout,
#                                   product-master, inventory-storage,
#                                   wes-work-planning, fulfillment-execution,
#                                   workforce-management, order-management)
#   inter-warehouse-transfer-scenario  the transfer saga (the 8 above plus
#                                   warehouse-planning and
#                                   network-inventory-planning)
#   inbound-receiving-scenario      @inbound-receiving (product-master,
#                                   facility-layout, dock-scheduling,
#                                   yard-management, inbound-receiving,
#                                   inventory-storage, exception-management)
#   inbound-journey-scenario        @inbound-journey: the whole dock chain on
#                                   the same six services
#   slotting-optimization-scenario  @slotting (facility-layout, product-master,
#                                   slotting-optimization)
#   returns-exceptions-scenario     @returns-exceptions (returns-processing,
#                                   exception-management, inventory-storage)
#   yard-journey-scenario           @yard-journey (facility-layout,
#                                   product-master, inbound-receiving,
#                                   dock-scheduling, yard-management + its
#                                   relay, outbound-shipping)
#
# The environment each service is started with lives in scripts/services.sh
# (one up_<service> function each), shared with scripts/03-up-services.sh: a
# service that gains a mandatory variable (every consumer group is one, since
# the real-wiring standard) is fixed there once, not per job. The topics come
# from cmd/ensure-topics for the same reason. A job builds ONLY the binaries of
# the repos it checks out: scripts/01-build.sh builds every service and dies on
# the first missing sibling.
#
# A scheduled run is what the weekly sensor reads; a manual run on develop counts
# as proof too (harness-health), so both trigger the harness:red steps of the
# bootstrap job.
on:
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 7am UTC (1h after ci.yml's mutation job)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The flagship end-to-end scenario (features/bootstrap.feature) plus the
  # @product-master scenario, across the 7 core bounded contexts and
  # process-path-management (workforce-management refuses a file catalogue and
  # every catalogue client replays process-path-management's topic, so it is
  # started and seeded first). product-master is the classification owner:
  # inventory-storage's classification PUT answers 410 and the readers keep local
  # copies of warehouse.product-master.events.
  bootstrap-scenario:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 20

    services:
      # Single-node KRaft Kafka, the exact config already proven to work
      # in this fleet (order-management/docker-compose.kafka.yml) -- a
      # GitHub Actions `services:` container rather than testcontainers,
      # since every consumer/producer here is a real long-running Go
      # binary spawned by shell, not a Go test process that could manage
      # its own testcontainers lifecycle.
      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"

    steps:
      - name: Checkout e2e-tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: e2e-tests

      - name: Checkout process-path-management
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/process-path-management
          ref: develop
          path: process-path-management

      - name: Checkout facility-layout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/facility-layout
          ref: develop
          path: facility-layout

      - name: Checkout product-master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/product-master
          ref: develop
          path: product-master

      - name: Checkout inventory-storage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/inventory-storage
          ref: develop
          path: inventory-storage

      - name: Checkout wes-work-planning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/wes-work-planning
          ref: develop
          path: wes-work-planning

      - name: Checkout fulfillment-execution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/fulfillment-execution
          ref: develop
          path: fulfillment-execution

      - name: Checkout workforce-management
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/workforce-management
          ref: develop
          path: workforce-management

      - name: Checkout order-management
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IQVO/order-management
          ref: develop
          path: order-management

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: e2e-tests/go.mod

      - name: Wait for Kafka to accept connections
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/9092) >/dev/null 2>&1; then
              echo "kafka is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::kafka never became reachable on localhost:9092"
          exit 1

      - name: Create every harness topic and wait for a leader on each
        working-directory: e2e-tests
        run: |
          # A fresh broker's first publish can race its metadata propagation
          # (Unknown Topic Or Partition) and a consumer group on a topic that
          # does not exist yet is never assigned a partition. cmd/ensure-topics
          # holds the one topic list of the whole estate (every service's
          # events and analytics topics, plus the ones only consumed), so a
          # job never carries a copy that goes stale.
          GOTOOLCHAIN=auto go run ./cmd/ensure-topics

      - name: Start per-service Postgres instances
        working-directory: e2e-tests
        run: |
          set -euo pipefail
          dbs="postgres-process-path postgres-facility postgres-product-master postgres-inventory postgres-wes postgres-fulfillment postgres-workforce postgres-order"
          docker compose -f docker-compose.yml up -d ${dbs}
          for svc in ${dbs}; do
            deadline=$((SECONDS + 60))
            while true; do
              status="$(docker inspect -f '{{.State.Health.Status}}' "e2e-${svc}" 2>/dev/null || echo starting)"
              [[ "${status}" == "healthy" ]] && break
              if (( SECONDS > deadline )); then
                echo "::error::${svc} never became healthy"
                docker logs "e2e-${svc}" || true
                exit 1
              fi
              sleep 1
            done
            echo "${svc} healthy"
          done

      - name: Build the 8 binaries this job needs
        working-directory: e2e-tests
        run: |
          set -euo pipefail
          source env.sh
          mkdir -p "${BIN_DIR}"

          build_one() {
            local name="$1" repo="$2" cmd_pkg="$3"
            echo "==> go build ${name} (${repo}/cmd/${cmd_pkg})"
            # GOTOOLCHAIN=auto: setup-go pins the toolchain to e2e-tests' own
            # go.mod, but a sibling may require a newer Go (product-master
            # needs >= 1.27.1).
            ( cd "${repo}" && GOTOOLCHAIN=auto CGO_ENABLED=0 go build -o "${BIN_DIR}/${name}" "./cmd/${cmd_pkg}" )
            echo "  OK   ${name} -> ${BIN_DIR}/${name}"
          }

          # Not scripts/01-build.sh verbatim: it also builds the services and
          # MCP servers this job does not check out.
          build_one process-path           "${PROCESS_PATH_REPO}" pathmgmt
          build_one facility               "${FACILITY_REPO}" facility
          build_one product-master         "${PRODUCT_MASTER_REPO}" api
          build_one inventory              "${INVENTORY_REPO}" inventory
          build_one wes                    "${WES_REPO}" wes
          build_one execution              "${FULFILLMENT_REPO}" execution
          build_one workforce              "${WORKFORCE_REPO}" workforce
          build_one order                  "${ORDER_REPO}" order

      - name: Start the 8 services and run @bootstrap,@product-master
        working-directory: e2e-tests
        run: |
          set -euo pipefail
          source scripts/lib.sh
          source scripts/services.sh

          # The env of every service lives in scripts/services.sh; the order
          # is the dependency order of scripts/03-up-services.sh.
          up_process_path
          up_facility
          up_product_master
          up_inventory
          up_wes
          up_execution
          up_workforce
          up_order

          echo "all 8 services healthy"

          export FACILITY_BASE_URL INVENTORY_BASE_URL WES_BASE_URL FULFILLMENT_BASE_URL WORKFORCE_BASE_URL ORDER_BASE_URL PRODUCT_MASTER_BASE_URL PROCESS_PATH_BASE_URL KAFKA_BROKERS
          # godog tag expression: a comma is OR.
          export GODOG_TAGS="@bootstrap,@product-master"
          go test -v -run TestMain -timeout 5m .

      - name: Dump service logs on failure
        if: failure()
        working-directory: e2e-tests
        run: tail -n 400 logs/*.log 2>&1 || true

      - name: Open or refresh the harness:red issue on a failure of the weekly (or a manual develop) run
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
        working-directory: e2e-tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harness/red_issue.py bootstrap-scenario "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Close the harness:red issue when the weekly (or a manual develop) run recovers
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
        working-directory: e2e-tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/harness/red_issue.py bootstrap-scenario --close


  # The inter-warehouse transfer saga (features/inter_warehouse_transfer.feature):
  # the bootstrap job's 8 services plus network-inventory-planning and
  # warehouse-planning, over the same single-node Kafka. It has no harness:red
