  # yard-management, plus outbound-shipping's ship-confirm on departure. Six
  # services (plus product-master, which inbound-receiving needs to accept an ASN
  # line, and yard-management's separate outbox relay): none of them calls another;
  # they agree only over Kafka, which is what the scenarios exercise. A separate
  # job so a failure here never masks the flagship @bootstrap signal; like the
  # other scenario jobs it has no harness:red issue steps of its own. The
  # upstream facts of the outbound leg (PackageManifested, CPTScheduleChanged) are
  # injected by the feature, so fulfillment-execution and process-path-management
  # are not started.
